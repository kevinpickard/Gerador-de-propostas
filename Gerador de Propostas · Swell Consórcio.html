<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de Propostas · Swell Consórcio</title>
<style>
:root{--bg:#f3f3f3;--fg:#111;--muted:#555;--card:#fff;--line:#d9d9d9;--accent:#fc7900;--field:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--fg:#f2f2f2;--muted:#aaa;--card:#1f1f1f;--line:#333;--field:#2a2a2a}}
:root[data-theme="dark"]{--bg:#141414;--fg:#f2f2f2;--muted:#aaa;--card:#1f1f1f;--line:#333;--field:#2a2a2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Arial,Helvetica,sans-serif}
.app{display:grid;gap:20px;padding:16px;max-width:1280px;margin:0 auto}
@media(min-width:960px){.app{grid-template-columns:380px 1fr;align-items:start}.panel{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h1{font-size:18px;margin:0 0 4px}
.panel p.sub{margin:0 0 12px;color:var(--muted);font-size:13px}
fieldset{border:0;border-top:2px solid var(--accent);margin:16px 0 0;padding:10px 0 0}
legend{font-weight:700;font-size:14px;padding-right:8px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 0}
input,select,textarea{width:100%;margin-top:3px;padding:9px 10px;font:inherit;font-size:16px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:6px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
button{font:inherit;font-weight:700;padding:10px 14px;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--fg);cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:#000}
.ca{display:flex;gap:8px;margin:8px 0 0}.ca button{font-size:13px;padding:6px 10px}
.cota{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px}.cota .ca{justify-content:space-between;align-items:center;margin:0}
.t th{text-align:right;padding:8px 10px;font-size:12px;color:#555;border-bottom:2px solid #fc7900}.t th:first-child{text-align:left}.t td:nth-child(2):not(:last-child){text-align:right;font-weight:700;color:#111}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.stage{overflow-x:auto}
/* ===== documento ===== */
.doc{width:210mm;max-width:100%;margin:0 auto;font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff;line-height:1.5;font-size:14px}
.pg{padding:14mm 14mm;border-bottom:1px solid #e5e5e5;background:#fff}
.doc h2{font-size:24px;margin:0 0 6px}
.doc h3{font-size:17px;margin:20px 0 6px}
.doc p{margin:6px 0;color:#555}
.cover{background:#000;color:#fff;min-height:200mm;display:flex;flex-direction:column;justify-content:space-between;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cover img{width:150px}
.cover .tag{color:#fc7900;font-weight:700;font-size:20px}
.cover h1{font-size:46px;line-height:1.1;margin:6px 0 10px;color:#fff}
.cover p{color:#ccc;font-size:17px}
.cover .for{border-left:4px solid #fc7900;padding-left:12px;color:#fff;font-size:16px;margin-top:20px}
.ben{display:grid;gap:10px;margin-top:14px}
.ben div{display:flex;gap:12px;background:#f3f3f3;border-radius:8px;padding:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ben b.n{flex:none;width:30px;height:30px;border-radius:50%;background:#fc7900;color:#000;display:grid;place-items:center}
.ben strong{display:block;color:#111}
.ben span{color:#555;font-size:13px}
.adm{background:#000;color:#fff;padding:12px 16px;border-radius:8px;margin:12px 0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.adm small{display:block;color:#fc7900;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.card{background:#f3f3f3;border-radius:8px;padding:12px;font-size:13px;color:#555;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.card strong{color:#111}.card em{font-style:normal;color:#fc7900;font-weight:700}
.num{word-break:break-all;font-size:15px;font-weight:700;color:#fc7900}
table.t{width:100%;border-collapse:collapse;margin:8px 0}
.t td{padding:8px 10px;border-bottom:1px solid #e5e5e5;vertical-align:top}
.t td:last-child{text-align:right;font-weight:700;color:#111}
.t tr:nth-child(odd) td{background:#f3f3f3;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.t td:first-child{color:#555}
.note{border-left:4px solid #fc7900;background:#f3f3f3;padding:10px 12px;font-size:12px;color:#555;margin:10px 0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.steps{display:grid;gap:10px;margin-top:12px}
.steps div{border:1px solid #ddd;border-radius:8px;padding:12px}
.steps strong{color:#fc7900}
.foot{margin-top:24px;padding-top:12px;border-top:3px solid #fc7900;font-weight:700;color:#111}
@media(max-width:600px){.pg{padding:20px 16px}.cover h1{font-size:34px}.two{grid-template-columns:1fr}}
@media print{
@page{size:A4;margin:0}
body{background:#fff}
.app{display:block;padding:0;max-width:none}
.panel{display:none}
.stage{overflow:visible}
.doc{width:auto;max-width:none}
.pg{break-after:page;border:0;padding:14mm}
.pg:last-child{break-after:auto}
.cover{min-height:277mm}
}
</style>
</head>
<body>
<div class="app">
<aside class="panel">
<h1>Gerador de propostas</h1>
<p class="sub">Informe o valor total do crédito e, em cada cota, o valor da carta e a parcela.</p>
<form id="f" onsubmit="return false"></form>
<div class="hint" id="chk" style="color:var(--accent);font-weight:700"></div>
<div class="btns">
<button class="pri" id="bPrint" type="button">Imprimir / salvar PDF</button>
<button id="bAdd" type="button">Adicionar cota</button><button id="bNum" type="button">Novo nº da proposta</button>
<button id="bReset" type="button">Restaurar exemplo</button>
</div>
<p class="hint">Nada é salvo: os dados do cliente somem ao fechar ou recarregar a página. Para o PDF, escolha “Salvar como PDF” na janela de impressão e, se puder, ative “Gráficos de segundo plano”.</p>
</aside>
<main class="stage"><div class="doc" id="doc"></div></main>
</div>
